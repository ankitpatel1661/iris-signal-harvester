name: Keep dashboard awake

# The public dashboard is linked from the submission, so it must not greet a reviewer with
# a "wake up" screen.
#
# A previous version of this workflow curl'd the app every six hours. It kept nothing awake,
# and the evidence says why:
#
#   * Streamlit Community Cloud counts *viewer sessions*. A session exists only once a client
#     opens the websocket at /_stcore/stream and the server creates one for it. A plain HTTP
#     GET fetches the page shell and never registers as a visitor.
#   * While the app was asleep, curl of /~/+/ returned HTTP 502 - so the old workflow failed
#     rather than waking anything (two of its last three scheduled runs failed).
#   * /healthz answers 200 {"status":"ok"} even then, because the Cloud edge serves it rather
#     than the app container. It is not a liveness signal for the app.
#   * A hand-rolled websocket completes the handshake but receives no ForwardMsg, so no
#     session is created. Reimplementing Streamlit's protocol would break on every change.
#
# So this opens the app in a real headless browser. Whatever Streamlit counts as a viewer, a
# browser is one. It also waits for text that only exists after the app has rendered, so a
# green run means the dashboard really served - not merely that an edge returned 200.
#
# Every two hours, because the app was observed asleep roughly eight hours after a visit.
# GitHub Actions minutes are free and unlimited on public repositories, so this costs nothing.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository activity. If the
# dashboard starts sleeping again, re-enable this from the Actions tab.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-dashboard-awake
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright with Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Open the dashboard and hold a session
        run: python scripts/keep_awake.py --hold-seconds 45 --attempts 3 --verbose
