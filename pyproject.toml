[project]
name = "iris-signal-harvester"
version = "0.1.0"
description = "Federated harvester for German municipal council documents, extracting infrastructure-trigger signals into PostGIS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ankitkumar Patel", email = "ankitpatel.svnit@gmail.com" }]

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<26",
    "typer>=0.12,<1",
    "PyYAML>=6.0,<7",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "respx>=0.21,<1",
    "hypothesis>=6.112,<7",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
iris-harvest = "iris_signal_harvester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_signal_harvester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:iris_signal_harvester.*"]
markers = [
    "integration: requires a live PostGIS database (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF", "SIM", "TID"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["iris_signal_harvester"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["shapely.*", "pyproj.*", "respx.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/iris_signal_harvester"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
