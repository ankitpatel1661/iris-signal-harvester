# IRIS quality thresholds and the PASS / WARN / FAIL rules.
#
# Why this file exists
# -------------------
# A harvester that reports "ran successfully" while silently dropping 90% of its
# input is worse than one that fails loudly. These thresholds are the contract that
# turns the quality report from a description into a gate: the report computes the
# measurements, this file decides what they mean, and the CLI's exit code follows the
# verdict. Changing a threshold is therefore a deliberate, reviewable act.
#
# Two things are deliberately kept apart everywhere below:
#
#   * a REJECTION is a record that failed a validation gate and is now a row in
#     `signal_ingest_reject`. It is a defect: either in the source data or in us.
#   * BELOW THRESHOLD is a record that parsed perfectly and simply is not an
#     infrastructure signal. It is the expected outcome for most council documents.
#
# Conflating them would let a real rejection spike hide inside a normal
# below-threshold rate, which is exactly the failure this project is judged on.
#
# Null-rate semantics: the fraction of STAGED records (those that reached the table)
# whose field is NULL. A value of 1.0 means "no expectation"; 0.0 means "must never
# be null". The numbers are not aspirations — they are calibrated to what German
# municipal OParl data actually contains, as verified on 2026-10-27:
# `Paper.date` is an ABSENT KEY (0 of 100 on body/1 page 1), `Paper` carries no
# `location` at all, and `Body.license` is likewise absent on the bodies observed.
# Absent and null are treated alike downstream; the wording matters only because
# this file claims to be calibrated against what was actually verified.

version: "2026.1"

null_rate_max:
  # --- structural: these cannot be null without the record being meaningless ---
  title: 0.0
  source_url: 0.0
  content_hash: 0.0
  # --- the signal itself: a staged record always carries a matched type ---
  signal_type: 0.0
  relevance_score: 0.0
  # --- dates: the ladder genuinely fails on real OParl data -------------------
  # Paper.date is null on most real papers; the HTTP header tier rescues some.
  # Above 65% unknown the source is not usable for time-series work and we say so.
  published_at: 0.65
  # --- geography: Paper carries no location, so tiers 4-5 dominate ------------
  # A null geom is honest (geo_method='unresolved'); it is not a defect.
  geom: 0.95
  ags: 0.30
  municipality_name: 0.30
  # --- content extras: OParl Paper has no summary field at all ---------------
  summary: 1.0
  document_type: 0.25
  source_licence: 1.0  # Body.license is absent on the observed bodies; 'undeclared' is a state

# Rules are evaluated in order: any FAIL condition wins, then any WARN condition,
# otherwise PASS. Every triggered condition is listed in the report with the
# specific bodies responsible, so a WARN is actionable without a grep.
rules:
  fail:
    # Of everything fetched, the share that was dead-lettered. A tenth of the
    # input being unusable is a defect, not a data characteristic.
    reject_rate_max: 0.10
    # Share of bodies whose sweep ended degraded (breaker tripped, access refused,
    # transport failure). One failing municipality degrades that municipality; a
    # quarter of them failing is a run-level failure.
    degraded_body_rate_max: 0.25
    # A structural field (null_rate_max == 0.0) breaching its limit is always FAIL.
    structural_fields_must_hold: true
    # A run that fetched records but staged none has not done its job.
    require_staged_when_fetched: true
    # The subtractive funnel must balance exactly. A non-zero residual means
    # records went missing unaccounted for, which invalidates every other number.
    require_funnel_balances: true

  warn:
    reject_rate_max: 0.02
    degraded_body_rate_max: 0.0
    # published_at_origin = 'unknown' share. Expected to be high on OParl; this is
    # the point at which incremental harvesting quality is worth reporting.
    unknown_date_rate_max: 0.50
    # geo_method = 'unresolved' share.
    unresolved_geo_rate_max: 0.80
    # Any non-structural null_rate_max breach is a WARN.
    null_rate_breach_is_warn: true

# --strict (CI mode): any record-level rejection fails the run, and a WARN is
# escalated to FAIL. Nothing silently degrades in CI.
strict:
  any_rejection_fails: true
  escalate_warn_to_fail: true

# Exit codes the CLI returns from the verdict.
exit_codes:
  pass: 0
  warn: 0   # 1 under --strict
  fail: 1
