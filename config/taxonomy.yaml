# IRIS signal taxonomy.
#
# Terms are written in natural German spelling (umlauts and ß included). The matcher
# applies the same fold() to this file as to the documents, so spelling variants such as
# "Wärmeplanung" / "Waermeplanung" are equivalent and need not be listed twice.
#
# Per-term keys:
#   term      canonical spelling, reported verbatim in every Hit
#   weight    0..1, how strongly this term alone indicates the signal type
#   compound  true  -> also match when the term is the HEAD of a longer compound
#                      ("Solarpark" inside "Solarparkerweiterung"; bounded suffix, see
#                      the taxonomy module docstring)
#             false -> whole-word match only (the default)
#
# Hyphens in a term are optional in the text: "Freiflächen-PV", "Freiflächen PV" and
# "FreiflächenPV" are one spelling to the matcher.
#
# RULE: a compound=true term must never be a bare generic head noun. Write "Solarpark",
# never "Park"; "Netzanschluss", never "Netz"; "Batteriespeicher", never "Speicher".
# Suffix matching is only safe because the term itself is already specific. The loader
# rejects the most common offenders, but it cannot know them all: review additions.
#
# The matcher only anchors a term on its LEFT at a word boundary, so a term does not match
# when it is the tail of a longer compound ("Freiflächensolarpark" is not found by
# "Solarpark"). List such compounds as terms in their own right.

version: "2026.10.1"

field_weights:
  title: 1.0
  summary: 0.6
  body: 0.4

breadth_bonus: 0.05
cap: 1.0
emit_min_score: 0.35

# A hit is suppressed when one of these appears within `window` tokens before or after it.
# Terms match as token prefixes, so "kein" also covers "keine", "keinen", "keiner".
negation:
  window: 4
  terms:
    - Ablehnung
    - abgelehnt
    - ablehnen
    - Rückbau
    - Aufhebung
    - aufgehoben
    - Rücknahme
    - zurückgenommen
    - kein
    - Verzicht

